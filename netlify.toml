# Netlify: static site + serverless functions

[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[functions."rental-reminders"]
  schedule = "*/10 * * * *"

[[redirects]]
  from = "/api/notify-order"
  to = "/.netlify/functions/notify-order"
  status = 200

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin-api"
  status = 200

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

# Cache static assets
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
